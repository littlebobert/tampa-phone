[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tampa-phone"
version = "0.1.0"
description = "A phone-first restaurant menu browser built with LiveKit and Twilio"
requires-python = ">=3.10, <3.15"
dependencies = [
    "httpx>=0.27,<1",
    "livekit-agents>=1.6.9",
    "python-dotenv>=1.0",
    "twilio>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
tampa-phone = "tampa_phone.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
